services:
  frontend:
    image: "docker.io/zs6bvr/togafmate-frontend:1.0"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:8080"
    networks:
      - togafmate

  backend:
    image: "docker.io/zs6bvr/togafmate-backend:1.0"
    restart: unless-stopped
    environment:
      DB_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      DB_USERNAME: "${POSTGRES_USER}"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      JPA_DDL_AUTO: "${JPA_DDL_AUTO}"
      APP_BOOTSTRAP_ADMIN_USER_ID: "${APP_BOOTSTRAP_ADMIN_USER_ID}"
      APP_BOOTSTRAP_ADMIN_PASSWORD: "${APP_BOOTSTRAP_ADMIN_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - togafmate

  postgres:
    image: "postgres:${POSTGRES_VERSION}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - togafmate

networks:
  togafmate:
    driver: bridge
